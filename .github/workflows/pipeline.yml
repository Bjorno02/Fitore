name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: ${{ github.ref == 'refs/heads/main' && 'Build & Deploy Candidate' || 'App Build' }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g vercel@59
      - run: vercel pull --yes --environment=$TARGET_ENV --token=${{ secrets.VERCEL_TOKEN }}
      # secret vars pull as placeholder; prisma generate needs some url
      - run: |
          sed -i '/="\[SENSITIVE\]"$/d' .vercel/.env.$TARGET_ENV.local
          echo 'DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy' >> .vercel/.env.$TARGET_ENV.local
      - env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        if: env.SENTRY_AUTH_TOKEN != ''
        run: echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> .vercel/.env.$TARGET_ENV.local
      - run: vercel build ${{ env.TARGET_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      # production target, no domain yet; promote job moves traffic
      - id: deploy
        if: env.IS_MAIN == 'true'
        run: |
          set -o pipefail
          url=$(vercel deploy --prebuilt --prod --skip-domain --yes --token=${{ secrets.VERCEL_TOKEN }} | tee /dev/stderr | tail -n1)
          [ -n "$url" ] || { echo "vercel deploy printed no url"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-End Tests
    needs: [build, unit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-real-secret-change-me
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  migrate:
    name: Migrate
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy

  smoke:
    name: Smoke Test
    needs: [build, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      URL: ${{ needs.build.outputs.url }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" "$URL/login")
            [ "$code" = "200" ] && break
            sleep 6
          done
          echo "login: $code"; [ "$code" = "200" ]
      - run: |
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H "x-vercel-protection-bypass: $BYPASS" "$URL/")
          echo "home signed out: $out"; [ "$out" = "307 $URL/login" ]
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" -X POST -H 'content-type: application/json' -d '{}' "$URL/api/sessions")
          echo "api/sessions unauthenticated: $code"; [ "$code" = "401" ]
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" "$URL/api/dashboard/summary")
          echo "api/dashboard/summary unauthenticated: $code"; [ "$code" = "401" ]

  promote:
    name: Promote to Production
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fitore.vercel.app
    steps:
      - run: npm install -g vercel@59
      - run: vercel promote ${{ needs.build.outputs.url }} --yes --token=${{ secrets.VERCEL_TOKEN }}
      - run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://fitore.vercel.app/login)
            [ "$code" = "200" ] && break
            sleep 6
          done
          echo "domain after promote: $code"; [ "$code" = "200" ]
